<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="JAGO - National Scholarship Portal">

  <!-- iOS & Android meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JAGO">
  <meta name="theme-color" content="#046A38">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>JAGO — National Scholarship Portal</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0B132B;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #splash {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1E293B 0%, #0B132B 100%);
      z-index: 99999;
      color: white;
      text-align: center;
      padding: 24px;
    }
    .splash-emblem {
      font-size: 52px;
      margin-bottom: 12px;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
    }
    .splash-title {
      font-size: 30px;
      font-weight: 900;
      color: #22C55E;
      letter-spacing: 3px;
      margin-bottom: 6px;
      text-shadow: 0 2px 12px rgba(34, 197, 94, 0.35);
    }
    .splash-fullform {
      font-size: 13.5px;
      font-weight: 600;
      color: #F8FAFC;
      letter-spacing: 0.3px;
      margin-bottom: 8px;
      max-width: 320px;
      line-height: 1.4;
      text-transform: capitalize;
    }
    .splash-subtitle {
      font-size: 11.5px;
      color: #94A3B8;
      font-weight: 500;
      margin-bottom: 28px;
      max-width: 290px;
      line-height: 1.4;
      letter-spacing: 0.4px;
    }
    .splash-spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid rgba(255, 255, 255, 0.15);
      border-top-color: #22C55E;
      border-radius: 50%;
      animation: spin 0.9s infinite linear;
      margin-bottom: 14px;
    }
    .splash-status {
      font-size: 12px;
      color: #64748B;
      letter-spacing: 0.5px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" width="76" height="76" style="border-radius:18px; box-shadow:0 10px 25px rgba(0,0,0,0.4); margin-bottom:16px;" alt="JAGO Logo">
    <div class="splash-title">JAGO</div>
    <div class="splash-fullform">Janjatiya Awareness & Guidance for Opportunities</div>
    <div class="splash-subtitle">National Scholarship Portal • Student App</div>
    <div class="splash-spinner"></div>
    <div class="splash-status">Loading National Scholarship App...</div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }

    function _dismissSplash() {
      var splash = document.getElementById('splash');
      if (splash) {
        splash.style.transition = 'opacity 0.4s ease';
        splash.style.opacity = '0';
        setTimeout(function() { if (splash && splash.parentNode) splash.parentNode.removeChild(splash); }, 400);
      }
    }
    window.addEventListener('flutter-first-frame', _dismissSplash);
    setTimeout(_dismissSplash, 2500);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
